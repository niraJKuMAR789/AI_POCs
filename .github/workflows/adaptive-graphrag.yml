name: adaptive-graphrag

on:
  push:
    paths: ["adaptive-graphrag/**", ".github/workflows/adaptive-graphrag.yml"]
  pull_request:
    paths: ["adaptive-graphrag/**", ".github/workflows/adaptive-graphrag.yml"]

defaults:
  run:
    working-directory: adaptive-graphrag

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ATLAS_PROVIDER: offline  # deterministic providers: no API key or network needed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv venv && uv pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src tests && .venv/bin/ruff format --check src tests
      - name: Type check
        run: .venv/bin/mypy src
      - name: Tests
        run: .venv/bin/pytest
      - name: Offline end-to-end eval (smoke)
        run: ATLAS_DATA_DIR=/tmp/atlas .venv/bin/atlas eval --out /tmp/eval_report.md

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: adaptive-graphrag
          push: false
          tags: atlas-graphrag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
