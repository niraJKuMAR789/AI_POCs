name: agent-observability

on:
  push:
    paths: ["agent-observability/**", ".github/workflows/agent-observability.yml"]
  pull_request:
    paths: ["agent-observability/**", ".github/workflows/agent-observability.yml"]

defaults:
  run:
    working-directory: agent-observability

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv venv && uv pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src tests ui examples && .venv/bin/ruff format --check src tests ui examples
      - name: Type check
        run: .venv/bin/mypy src
      - name: Tests
        run: .venv/bin/pytest
      - name: Detection + RCA benchmark (quick)
        run: ARGUS_DB_PATH=/tmp/argus/argus.db .venv/bin/argus eval --quick --out /tmp/argus-eval.md && cat /tmp/argus-eval.md

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: agent-observability
          push: false
          tags: argus:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
