name: claims-audit-agents

on:
  push:
    paths: ["claims-audit-agents/**", ".github/workflows/claims-audit-agents.yml"]
  pull_request:
    paths: ["claims-audit-agents/**", ".github/workflows/claims-audit-agents.yml"]

defaults:
  run:
    working-directory: claims-audit-agents

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AEGIS_PROVIDER: offline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv venv && uv pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src tests ui && .venv/bin/ruff format --check src tests ui
      - name: Type check
        run: .venv/bin/mypy src
      - name: Tests
        run: .venv/bin/pytest
      - name: Synthetic data is reproducible
        run: .venv/bin/aegis generate && git diff --exit-code data/
      - name: Offline benchmark
        run: AEGIS_STATE_DIR=/tmp/aegis .venv/bin/aegis eval --out /tmp/report.md

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: claims-audit-agents
          push: false
          tags: aegis:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
