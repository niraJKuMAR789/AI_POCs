name: governed-text2sql

on:
  push:
    paths: ["governed-text2sql/**", ".github/workflows/governed-text2sql.yml"]
  pull_request:
    paths: ["governed-text2sql/**", ".github/workflows/governed-text2sql.yml"]

defaults:
  run:
    working-directory: governed-text2sql

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      QUILL_PROVIDER: offline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv venv && uv pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src tests finetune && .venv/bin/ruff format --check src tests finetune
      - name: Type check
        run: .venv/bin/mypy src
      - name: Tests (guardrails, pipeline, Agno agent, MCP, API, red-team)
        run: .venv/bin/pytest
      - name: Offline eval smoke (kNN baseline + red-team)
        run: .venv/bin/quill init-db && .venv/bin/quill eval --out /tmp/report.md && cat /tmp/report.md

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: governed-text2sql
          push: false
          tags: quill:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
