[project]
name = "atlas-graphrag"
version = "0.1.0"
description = "Atlas: an adaptive GraphRAG research agent (LangGraph + NVIDIA NIM + Qdrant + Neo4j + MCP)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Niraj Kumar Marepally" }]
license = { text = "MIT" }
dependencies = [
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "langchain-nvidia-ai-endpoints>=1.4",
    "langchain-text-splitters>=1.0",
    "qdrant-client>=1.19",
    "neo4j>=6.0",
    "networkx>=3.4",
    "rank-bm25>=0.2.2",
    "mcp>=2.2",
    "fastapi>=0.140",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.35",
    "sse-starlette>=3.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "httpx>=0.28",
    "structlog>=25.0",
    "tenacity>=9.0",
    "pypdf>=6.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.50"]
dev = ["pytest>=8.4", "pytest-asyncio>=1.1", "ruff>=0.13", "mypy>=1.18"]

[project.scripts]
atlas = "atlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.ruff.lint.per-file-ignores]
"src/atlas/evals/runner.py" = ["ASYNC240"]  # offline CLI job; blocking file I/O is fine here
