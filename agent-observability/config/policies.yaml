# Governance policy per project (keys under `projects` override `default`).
default:
  capture_content: true        # store prompts/completions at all
  pii: redact                  # redact | block (drop content) | allow
  allowed_models: []           # empty = any model allowed
  forbidden_tools: []
  max_tokens_per_call: 32000
  max_cost_per_trace_usd: 0.50
  max_steps_per_trace: 60
  daily_budget_usd: 100.0
  retention_days: 30           # spans and metrics
  content_retention_days: 7    # prompt/completion text is dropped sooner than metrics

projects:
  support-bot:
    allowed_models: [nvidia/nemotron-3-super-120b-a12b, nvidia/nemotron-3-nano-30b-a3b, nvidia/llama-nemotron-embed-1b-v2]
    forbidden_tools: [delete_account]
    max_cost_per_trace_usd: 0.05
  research-agent:
    max_steps_per_trace: 40
    max_cost_per_trace_usd: 0.25
  claims-agent:
    pii: block
    allowed_models: [nvidia/nemotron-3-super-120b-a12b, nvidia/nemotron-3-nano-30b-a3b]
