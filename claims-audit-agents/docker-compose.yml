services:
  api:
    build: .
    env_file: .env
    ports: ["8002:8002"]
    volumes: ["aegis-state:/state"]   # checkpoints + audit ledger survive restarts
  ui:
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      AEGIS_API_URL: http://api:8002
    ports: ["8502:8501"]
    depends_on: [api]
volumes:
  aegis-state:
