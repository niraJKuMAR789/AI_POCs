[project]
name = "mission-control"
version = "0.1.0"
description = "Atlas, Quill and Aegis running on one Argus: shared observability, governance and fault drills"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Niraj Kumar Marepally" }]
dependencies = [
  "argus-agent-observability",
  "atlas-graphrag",
  "quill-text2sql",
  "aegis-claims-audit",
]

[project.optional-dependencies]
ui = ["streamlit>=1.50", "plotly>=6.0", "pandas>=2.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13", "types-PyYAML"]

[project.scripts]
mission-control = "mission_control.cli:main"

[tool.uv.sources]
argus-agent-observability = { path = "../agent-observability", editable = true }
atlas-graphrag = { path = "../adaptive-graphrag", editable = true }
quill-text2sql = { path = "../governed-text2sql", editable = true }
aegis-claims-audit = { path = "../claims-audit-agents", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mission_control"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
